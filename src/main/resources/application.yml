spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:prices_db}}
    username: ${DB_USER:${POSTGRES_USER:postgres}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:postgres}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    generator:
      write-bigdecimal-as-plain: true
app:
  symbol: ${BINANCE_SYMBOL:BNBUSDT}
binance:
  base-url: ${BINANCE_BASE_URL:https://api.binance.com}
  http-version: HTTP_1_1
  connect-timeout: 3s
  read-timeout: 5s
scheduler:
  poll-interval: ${BINANCE_POLL_INTERVAL:PT30S}
  default-rate-limit-pause: 1m
logging:
  group:
    app:
      - io.github.m1ffer.prices
      - org.springframework.web.filter.CommonsRequestLoggingFilter
  level:
    app: ${APP_LOG_LEVEL:INFO}